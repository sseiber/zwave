# Publishes the multi-arch image to GHCR.
#
# This replaces running `npm run dockerbuild` from a laptop. That needed a personal
# access token with write:packages stored in the local Docker keychain, which expires
# every 90 days and carries far more account access than a push requires. A workflow
# run gets a GITHUB_TOKEN instead: scoped to this repository, valid only for the run,
# and nothing to rotate.
#
# A release is a git tag, and nothing else is. The previous design inferred it, by
# asking the registry whether package.json's version already had an image. An inference
# is the wrong foundation for a release: it skipped a merge that still had :latest to
# move, and :latest sat on 1.4.0 for six releases while every run reported success. A
# tag says what the author meant, so there is nothing left to infer.
#
# Two ways in:
#
#   push a tag v*      The release. Publishes :<version> and moves :latest. The tag
#                      version must match every package.json in the repo or the run
#                      fails before building — a tag that disagrees with the image it
#                      produced is a trap for whoever reads it later. Use
#                      .scripts/incVersion.sh, which bumps, commits, tags and pushes
#                      together so the two cannot drift.
#   workflow_dispatch  Rebuilds whatever ref you pick at its package.json version and
#                      leaves :latest alone. This is the build/push/pull-on-the-tablet
#                      loop; it needs the work neither merged nor tagged:
#                        gh workflow run publish-image.yml --ref <branch>
#
# Both architectures build on native runners in parallel rather than one of them under
# QEMU, which this repo gets free because it is public. Each pushes an untagged image
# by digest; the merge job then binds the two digests under the tags.

name: Publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The whole reason this workflow exists: the only credential it needs is handed to it.
permissions:
  contents: read
  packages: write

# Never let two publishes of the same ref race to write the same tag
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve and check the version
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        name: Resolve the version and check every manifest agrees with the tag
        run: |
          set -euo pipefail

          # The image name has one source of truth, the file the local script reads too
          image=$(node -p "require('./configs/imageConfig.json').imageName")
          echo "image=$image" >> "$GITHUB_OUTPUT"

          # A hand-triggered run is an iteration build, not a release: it publishes
          # whatever package.json says and leaves :latest alone, so a half-finished
          # branch can never become what a fresh deployment pulls.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(node -p "require('./package.json').version")
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rebuilding $image:$version from $GITHUB_REF_NAME (:latest untouched)"
            exit 0
          fi

          version="${GITHUB_REF#refs/tags/v}"

          # There is one image, so every workspace version moves together. A workspace
          # left behind means the bump was done by hand and half-finished, and the tag
          # would name a version the image does not report.
          mismatched=false
          for manifest in package.json packages/*/package.json; do
            found=$(node -p "require('./$manifest').version")
            if [ "$found" != "$version" ]; then
              echo "::error file=$manifest::$manifest says $found, but the tag says $version"
              mismatched=true
            fi
          done

          if [ "$mismatched" = true ]; then
            echo "::error::Tag v$version disagrees with the repo. Use .scripts/incVersion.sh, which bumps and tags together."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing $image:$version, and moving :latest onto it"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image build is the verification: its build stage runs `npm run build` and
      # `npm run lint`, so a failure here is a failed build or a lint error.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      # Each arch is pushed untagged; hand its digest to the merge job to bind together
      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tag
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          set -euo pipefail

          tags=(-t "$IMAGE:$VERSION")
          if [ "$LATEST" = "true" ]; then
            tags+=(-t "$IMAGE:latest")
          fi

          # Each file is named for the digest its arch was pushed under
          docker buildx imagetools create "${tags[@]}" \
            $(printf "$IMAGE@sha256:%s " *)

          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "::notice::Published $IMAGE:$VERSION"
