# Publishes the multi-arch image to GHCR.
#
# This replaces running `npm run dockerbuild` from a laptop. That needed a personal
# access token with write:packages stored in the local Docker keychain, which expires
# every 90 days and carries far more account access than a push requires. A workflow
# run gets a GITHUB_TOKEN instead: scoped to this repository, valid only for the run,
# and nothing to rotate.
#
# Two ways in, because the version bump is the release signal in this repo:
#
#   workflow_dispatch  Publishes whatever branch you pick. This is the one for the
#                      build/push/pull-on-the-tablet loop — it does not need the work
#                      merged first:  gh workflow run publish-image.yml --ref <branch>
#   push to main       Publishes if package.json's version has no image yet, so merging
#                      a PR that did not bump the version republishes nothing. If the
#                      version was already published from its branch, the merge moves
#                      :latest onto it instead -- a tag copy, not a rebuild.
#
# Both architectures build on native runners in parallel rather than one of them under
# QEMU, which this repo gets free because it is public. Each pushes an untagged image
# by digest; the merge job then binds the two digests under the version tag.

name: Publish image

on:
  workflow_dispatch:
  push:
    branches: [main]

# The whole reason this workflow exists: the only credential it needs is handed to it.
permissions:
  contents: read
  packages: write

# Never let two publishes of the same ref race to write the same tag
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide what to publish
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      latest: ${{ steps.plan.outputs.latest }}
      retag: ${{ steps.plan.outputs.retag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: plan
        name: Decide whether to build, to move :latest, or to do nothing
        run: |
          set -euo pipefail

          # One source of truth for both, the same two the local script reads
          image=$(node -p "require('./configs/imageConfig.json').imageName")
          version=$(node -p "require('./package.json').version")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # :latest follows main only, so a branch build can never move it
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            latest=true
          else
            latest=false
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          # Empty for a tag that does not exist. An unexpected empty answer biases
          # towards doing the work rather than skipping it, which is the safe way round.
          digest_of() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>/dev/null || true
          }

          plan() {
            echo "publish=$1" >> "$GITHUB_OUTPUT"
            echo "retag=$2" >> "$GITHUB_OUTPUT"
            echo "::notice::$3"
          }

          # A hand-triggered run always builds: that is the iteration loop, and it is
          # expected to overwrite the tag it just pushed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            plan true false "Publishing $image:$version (manual run from $GITHUB_REF_NAME)"
            exit 0
          fi

          version_digest=$(digest_of "$image:$version")

          if [ -z "$version_digest" ]; then
            plan true false "Publishing $image:$version"
            exit 0
          fi

          # The version already has an image. Usually that means a branch run of this
          # workflow published it before the PR merged, so there is nothing to rebuild
          # from the same source -- but :latest can still be behind, and skipping the
          # whole run on existence alone is what used to leave it behind for good.
          if [ "$latest" != true ]; then
            plan false false "$image:$version is already published — nothing to do. Bump the version to publish."
          elif [ "$(digest_of "$image:latest")" = "$version_digest" ]; then
            plan false false "$image:$version is already published and :latest points at it — nothing to do."
          else
            plan false true "$image:$version is already published; moving :latest onto it without rebuilding."
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image build is the verification: its build stage runs `npm run build` and
      # `npm run lint`, so a failure here is a failed build or a lint error.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      # Each arch is pushed untagged; hand its digest to the merge job to bind together
      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tag
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          set -euo pipefail

          tags=(-t "$IMAGE:$VERSION")
          if [ "$LATEST" = "true" ]; then
            tags+=(-t "$IMAGE:latest")
          fi

          # Each file is named for the digest its arch was pushed under
          docker buildx imagetools create "${tags[@]}" \
            $(printf "$IMAGE@sha256:%s " *)

          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "::notice::Published $IMAGE:$VERSION"

  # Moving a tag onto an index that is already in the registry copies no layers and
  # needs no builders, so this costs seconds where a rebuild of both architectures
  # costs minutes. It is the normal path for a release whose branch was test-published.
  retag:
    name: Move :latest onto the published version
    needs: prepare
    if: needs.prepare.outputs.retag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Repoint :latest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:latest"
          echo "::notice::Moved $IMAGE:latest onto $VERSION"
